version: '3.8'

services:
  flowcast-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcast-ai-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
